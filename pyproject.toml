[project]
name = "hermes-agent-mixer"
version = "0.2.0"
description = "A mixing desk for how much a coding agent may change: Hermes plugin plus Claude Code, Codex and Gemini CLI hooks"
authors = [{ name = "Sahil Saghir" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-mixer = "hermes_agent_mixer.cli:main"

[project.entry-points."hermes_agent.plugins"]
hermes-agent-mixer = "hermes_agent_mixer"

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0"]
dashboard = ["fastapi>=0.110", "httpx>=0.27"]  # only for testing dashboard/plugin_api.py; the file runs in the dashboard server, never in the agent runtime

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: slow test that installs the plugin into a sandbox HERMES_HOME (deselect with -m 'not slow')",
    "native: drives the real Hermes plugin loader; needs MIXER_NATIVE_PYTHON (skipped otherwise)",
]

[tool.setuptools]
packages = ["hermes_agent_mixer", "hermes_agent_mixer.core", "hermes_agent_mixer.hermes", "hermes_agent_mixer.harness"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"